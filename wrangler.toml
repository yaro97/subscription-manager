name = "subscription-manager"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 保留原来的 Cloudflare KV
[[kv_namespaces]]
binding = "SUBSCRIPTIONS_KV"
id = "bf25dec6c9374c6badce93fcc40ce8eb"

# 新版前端静态资源
[assets]
directory = "./public"
binding = "ASSETS"

# 每小时检查一次提醒
[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "production"
